<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inspection History PACK VERIFY</title><link rel="stylesheet" href="style.css"></head><body><header class="top">
<div style="display:flex;align-items:center"><button class="menu" onclick="toggleMenu()">☰</button><a class="logo" href="dashboard.html">PACK VERIFY</a></div>
<div class="profile"><div><b>OFFICER12</b><div class="small muted">Inspection Officer</div></div><button class="secondary" onclick="logout()">Logout</button></div>
</header>
<div class="layout"><aside id="sidebar" class="side">
<a class="nav" data-page="dashboard.html" href="dashboard.html">Dashboard</a>
<a class="nav" data-page="scan.html" href="scan.html">Scan Product</a>
<a class="nav" data-page="history.html" href="history.html">Inspection History</a>
<a class="nav" data-page="products.html" href="products.html">Product Repository</a>
<a class="nav" data-page="reports.html" href="reports.html">Reports</a>
<a class="nav" data-page="rules.html" href="rules.html">Compliance Rules</a>
</aside><main class="content"><section><div class="head"><div><h1>Inspection History</h1><p class="muted">Search previous inspections</p></div></div><div class="panel"><div style="display:flex;gap:10px;margin-bottom:15px"><input id="q" placeholder="Search product, inspection ID or category" oninput="render()"><select id="f" onchange="render()"><option>All</option><option>Compliant</option><option>Review Required</option><option>Potential Issue</option></select></div><div style="overflow:auto"><table class="table"><thead><tr><th>ID</th><th>Product</th><th>Category</th><th>Status</th><th>Date</th></tr></thead><tbody id="body"></tbody></table></div></div></section>
<script>
const data=[['HS-1024','FreshBite Biscuits','Food','Compliant','01 Sep 2026'],['HS-1023','PureDrop Cooking Oil','Edible Oil','Review Required','01 Sep 2026'],['HS-1022','DailyCare Soap','Personal Care','Potential Issue','31 Aug 2026'],['HS-1021','CleanHome Detergent','Household','Compliant','30 Aug 2026'],['HS-1020','MorningSip Beverage','Beverage','Review Required','29 Aug 2026']];
function render(){const s=(q.value||'').toLowerCase(),f=document.getElementById('f').value;body.innerHTML=data.filter(x=>(!s||x.join(' ').toLowerCase().includes(s))&&(f==='All'||x[3]===f)).map(x=>`<tr><td>${x[0]}</td><td><b>${x[1]}</b></td><td>${x[2]}</td><td><span class="badge ${x[3]==='Compliant'?'green':x[3]==='Review Required'?'amber':'red'}">${x[3]}</span></td><td>${x[4]}</td></tr>`).join('')}render();
</script></main></div><div id="toast" class="toast"></div>
<script>
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
function logout(){localStorage.removeItem('hexa_auth');location.href='login.html'}
if(!localStorage.getItem('hexa_auth')) location.href='login.html';
const page=location.pathname.split('/').pop()||'dashboard.html';
document.querySelectorAll('.nav').forEach(n=>{if(n.dataset.page===page)n.classList.add('active')});
function toast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
</script></body></html>
